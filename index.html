    <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D God</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>D&D God</h1>
        <nav>
            <a href="#" id="spells-link">Заклинания</a>
            <a href="#" id="bestiary-link">Бестиарий</a>
        </nav>
        <div class="header-controls"> 
            <input type="text" id="search-input" placeholder="Поиск...">
            <button id="filter-button">⚙️</button>
        </div>
    </header>

    <main>
        <div class="container">
            <aside class="description">
    <h2 id="description-title"></h2>
    <div id="level-or-danger">
        <span id="level-danger-label"></span>
        <span id="level-danger-value"></span>
    </div>
    <p id="description-text"></p>
</aside>
            <section class="list" id="item-list">
                <!-- Здесь будут изображения заклинаний/бестиария -->
            </section>
        </div>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-title"></h2>
            <p id="modal-description"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

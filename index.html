<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D God</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>D&D God</h1>
        <nav>
            <a href="#" id="spells-link">Заклинания</a>
            <a href="#" id="bestiary-link">Бестиарий</a>
        </nav>
    </header>

    <main>
        <div class="container">
            <aside class="description">
                <!-- Здесь будет описание заклинания/бестиария -->
                <h2 id="description-title"></h2>
                <p id="description-text"></p>
            </aside>

            <section class="list" id="item-list">
                <!-- Здесь будут изображения заклинаний/бестиария -->
            </section>

            <aside class="sidebar">
                <input type="text" id="search-input" placeholder="Поиск...">
                <button id="filter-button">⚙️ Фильтры</button>
            </aside>
        </div>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-title"></h2>
            <p id="modal-description"></p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
